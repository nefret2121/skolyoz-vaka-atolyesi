# Mevcut HTTPS server {} bloğuna ekleyin; site alan adı/TLS ayarlarını koruyun.
location = /vaka-atolyesi {
    return 302 /vaka-atolyesi/;
}
location /vaka-atolyesi/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # İstemcinin kendi gönderdiği X-Forwarded-For değerini devralmayın.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2k;
    proxy_read_timeout 30s;
    # HTML, görsel, PDF veya lesson.json için auth dışı static location eklemeyin.
}
